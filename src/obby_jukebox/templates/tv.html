<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>h4ks tv</title>
  <style>
    :root { --bg: #11131c; --panel: #191d2a; --border: #2e3550;
      --text: #f0f4ff; --dim: #7b8ab0; --mid: #b0bfe0;
      --blue: #5c9eff; --orange: #ff8c4b; }
    * { box-sizing: border-box; border-radius: 0 !important; }
    body { margin: 0; border-top: 2px solid var(--blue); background: var(--bg);
      color: var(--text); font: 15px/1.6 system-ui, sans-serif; }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 2rem 4rem; }
    header { align-items: flex-start; border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between;
      padding: 1.8rem 0 1.4rem; }
    .site-title { color: var(--blue); font: bold 1.5rem 'Courier New', monospace; }
    .tagline { color: var(--dim); font: .82rem 'Courier New', monospace; }
    nav { display: flex; flex-wrap: wrap; gap: .15rem; }
    nav a { border: 1px solid transparent; color: var(--mid); font: .82rem 'Courier New', monospace;
      padding: .2rem .65rem; }
    nav a:hover { background: var(--panel); border-color: var(--border); text-decoration: none; }
    .label { border-left: 2px solid var(--blue); color: var(--mid); font: .72rem 'Courier New', monospace;
      letter-spacing: .15em; margin: 2.2rem 0 1rem; padding-left: .7rem; text-transform: uppercase; }
    .stage { background: #080a10; border: 1px solid var(--border); }
    video { background: #080a10; display: block; min-height: 320px; width: 100%; }
    .stage-bar { align-items: center; background: var(--panel); border-top: 2px solid var(--orange);
      display: flex; gap: 1rem; justify-content: space-between; padding: .7rem 1rem; }
    .live { color: var(--orange); font: bold .78rem 'Courier New', monospace; letter-spacing: .12em; }
    #sound { background: var(--orange); border: 0; color: #11131c; cursor: pointer;
      font: bold .78rem 'Courier New', monospace; padding: .35rem .8rem; }
    .offline { color: var(--dim); }
    .info { display: grid; gap: 2rem; grid-template-columns: 2fr 1fr; }
    .panel { background: var(--panel); border: 1px solid var(--border); padding: 1rem; }
    .queues { display: grid; gap: 1rem; }
    .queue-card { background: var(--panel); border: 1px solid var(--border); padding: 1rem; }
    .queue-card.ondemand { border-left: 3px solid var(--blue); }
    .queue-card.fallback { border-left: 3px solid var(--orange); }
    .queue-card h3 { font: bold .78rem 'Courier New', monospace; letter-spacing: .1em;
      margin: 0 0 .6rem; text-transform: uppercase; }
    .queue-card.ondemand h3 { color: var(--blue); }
    .queue-card.fallback h3 { color: var(--orange); }
    ol { color: var(--mid); margin: 0; padding-left: 1.4rem; }
    li { padding: .2rem 0; }
    @media (max-width: 700px) { .container { padding: 0 1rem 2rem; }
      .info { grid-template-columns: 1fr; } video { min-height: 220px; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div><a class="site-title" href="https://h4ks.com/">h4ks tv</a>
        <div class="tagline">a community of hackers, self-hosters &amp; builders</div></div>
      <nav><a href="https://chat.h4ks.com/">chat</a><a href="https://radio.h4ks.com/">radio</a>
        <a href="https://h4ks.com/">h4ks ↗</a></nav>
    </header>
    <div class="label">on air</div>
    <section class="stage">
      <video id="video" controls autoplay playsinline></video>
      <div class="stage-bar"><span id="status" class="offline">connecting…</span>
        <button id="sound" type="button" hidden>turn the sound on</button>
        <strong id="now">nothing on air</strong></div>
    </section>
    <div class="info">
      <section id="queues-section" hidden><div class="label">queue</div><div class="queues">
        <div class="queue-card ondemand" id="ondemand-card" hidden><h3>on demand</h3>
          <ol id="ondemand-queue"></ol></div>
        <div class="queue-card fallback" id="fallback-card" hidden><h3>automation fallback</h3>
          <ol id="fallback-queue"></ol></div>
      </div></section>
      <section><div class="label">the room</div><div class="panel">
        <a href="https://chat.h4ks.com/?channel=%24tv">join the $tv room ↗</a></div></section>
    </div>
  </div>
  <script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const now = document.getElementById('now');
    const sound = document.getElementById('sound');
    const queuesSection = document.getElementById('queues-section');
    const onDemandCard = document.getElementById('ondemand-card');
    const onDemandQueue = document.getElementById('ondemand-queue');
    const fallbackCard = document.getElementById('fallback-card');
    const fallbackQueue = document.getElementById('fallback-queue');
    let viewer;

    // Browsers refuse to autoplay a channel with sound until the viewer has
    // interacted with the site, and the refusal is silent — the tile just sits
    // black. Fall back to a muted start so the picture always runs; the native
    // controls carry the unmute, and the first click restores sound.
    async function start() {
      try {
        await video.play();
      } catch {
        video.muted = true;
        sound.hidden = false;
        await video.play().catch(() => {});
      }
    }

    function unmute() {
      video.muted = false;
      sound.hidden = true;
      video.play().catch(() => {});
    }

    // An empty queue is shown as nothing at all, card and section included.
    function renderList(card, element, entries) {
      card.hidden = !entries.length;
      element.replaceChildren();
      entries.forEach((entry) => {
        const item = document.createElement('li');
        item.textContent = entry;
        element.append(item);
      });
    }

    // The page is a viewer of the same $tv WebRTC channel as Obby. IRC is used
    // only for signaling; the player receives one continuous audio+video track
    // from the SFU, including the jukebox visualizer for radio items.
    const channel = '$tv';
    const rtcTag = '+obsidianirc/rtc';
    const ircUrl = 'wss://irc.h4ks.com:443';
    function unescapeTag(value) { return value.replace(/\\([:s\\rn])/g, (_, c) => { if (c === ':') return ';'; if (c === 's') return ' '; if (c === 'r') return '\r'; if (c === 'n') return '\n'; return '\\'; }); }
    function escapeTag(value) { return value.replace(/\\/g, '\\\\').replace(/;/g, '\\:').replace(/ /g, '\\s').replace(/\r/g, '\\r').replace(/\n/g, '\\n'); }
    function tagMessages(line) {
      if (!line.startsWith('@')) return null;
      const end = line.indexOf(' '); if (end < 0) return null;
      const tags = {};
      // Split on the FIRST '=' only: String.split with a limit drops the rest of
      // the value, and TURN URLs carry their own '=' signs.
      line.slice(1, end).split(';').forEach((part) => { const eq = part.indexOf('='); tags[eq < 0 ? part : part.slice(0, eq)] = eq < 0 ? null : unescapeTag(part.slice(eq + 1)); });
      return tags;
    }
    function sendSignal(socket, signal) {
      const full = {...signal, channel};
      const raw = JSON.stringify(full);
      const pieces = [];
      if (raw.length < 7000 || !signal.sdp) pieces.push(full);
      else { const id = crypto.randomUUID().slice(0, 12); const size = 3000; for (let i = 0; i < signal.sdp.length; i += size) pieces.push({...full, sdp: signal.sdp.slice(i, i + size), id, seq: pieces.length, total: Math.ceil(signal.sdp.length / size)}); }
      pieces.forEach((part) => socket.send(`@${rtcTag}=${escapeTag(JSON.stringify(part))} TAGMSG ${channel}\r\n`));
    }
    async function connectTv() {
      if (viewer) return;
      const socket = new WebSocket(ircUrl);
      const nick = `tv-${crypto.randomUUID().slice(0, 8)}`;
      const pending = new Map(); const earlyIce = []; let pc; let joined = false; let capRequested = false; let asked = false;
      viewer = {socket, close: () => { socket.close(); pc?.close(); viewer = null; }};
      socket.onopen = () => { socket.send('CAP LS 302\r\n'); socket.send(`NICK ${nick}\r\nUSER ${nick} 0 * :h4ks tv\r\n`); };
      socket.onmessage = async (event) => {
        const text = String(event.data); for (const line of text.split(/\r?\n/)) {
          if (!line) continue; if (line.startsWith('PING')) { socket.send(`PONG ${line.slice(5)}\r\n`); continue; }
          // The server answers 403 on a voice channel unless we hold obsidianirc/voice,
          // and the SFU only starts a session once we ask to join it by signal.
          if (line.includes(' CAP ') && line.includes(' LS ') && !capRequested) { capRequested = true; socket.send('CAP REQ :message-tags obsidianirc/voice\r\n'); continue; }
          if (line.includes(' CAP ') && (line.includes(' ACK ') || line.includes(' NAK '))) { socket.send('CAP END\r\n'); continue; }
          if (line.includes(' 001 ')) { socket.send(`JOIN ${channel}\r\n`); continue; }
          if (!asked && line.includes(` JOIN `) && line.includes(nick)) { asked = true; sendSignal(socket, {type: 'join'}); continue; }
          const tags = tagMessages(line); const raw = tags?.[rtcTag]; if (!raw) continue;
          let signal; try { signal = JSON.parse(raw); } catch { continue; }
          if (signal.total) { const key = signal.id; const entry = pending.get(key) ?? {parts: [], total: signal.total, base: signal}; entry.parts[signal.seq] = signal.sdp; pending.set(key, entry); if (entry.parts.filter(Boolean).length < entry.total) continue; signal = {...entry.base, sdp: entry.parts.join('')}; pending.delete(key); }
          // The SFU hands the streamer slot to whoever is around when the
          // jukebox re-publishes. This page only ever watches, so holding the
          // slot would leave the channel with nobody publishing at all.
          if (signal.role === 'streamer' && (signal.type === 'joined' || (signal.type === 'role' && signal.member === nick))) sendSignal(socket, {type: 'demote', target: nick});
          if (signal.type === 'joined' && !joined) {
            joined = true; pc = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.l.google.com:19302'}, ...(signal.turn ? [{urls: signal.turn.urls, username: signal.turn.username, credential: signal.turn.password}] : [])]});
            pc.addTransceiver('audio', {direction: 'recvonly'}); pc.addTransceiver('video', {direction: 'recvonly'});
            pc.ontrack = (event) => { if (event.streams[0]) video.srcObject = event.streams[0]; status.textContent = '● LIVE'; status.className = 'live'; start(); };
            pc.onicecandidate = (event) => { if (event.candidate) sendSignal(socket, {type: 'ice', cand: event.candidate.candidate, mid: event.candidate.sdpMid, mlineidx: event.candidate.sdpMLineIndex}); };
            pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed' || pc.connectionState === 'closed') viewer?.close(); };
            await pc.setLocalDescription(await pc.createOffer()); sendSignal(socket, {type: 'offer', sdp: pc.localDescription.sdp});
          } else if (signal.type === 'answer' && pc) {
            await pc.setRemoteDescription({type: 'answer', sdp: signal.sdp});
            // The SFU trickles its candidates right behind the answer, so some
            // arrive while setRemoteDescription is still pending and can only be
            // added once it lands.
            while (earlyIce.length) await pc.addIceCandidate(earlyIce.shift());
          } else if (signal.type === 'offer' && pc) {
            // The SFU renegotiates whenever the streamer's tracks change, which
            // is how a restarted jukebox reaches viewers who never left.
            await pc.setRemoteDescription({type: 'offer', sdp: signal.sdp});
            while (earlyIce.length) await pc.addIceCandidate(earlyIce.shift());
            await pc.setLocalDescription(await pc.createAnswer());
            sendSignal(socket, {type: 'answer', sdp: pc.localDescription.sdp});
          } else if (signal.type === 'ice' && pc) {
            const candidate = {candidate: signal.cand, sdpMid: signal.mid, sdpMLineIndex: signal.mlineidx};
            if (pc.remoteDescription) await pc.addIceCandidate(candidate); else earlyIce.push(candidate);
          }
        }
      };
      socket.onerror = () => { status.textContent = 'stream unavailable'; status.className = 'offline'; };
      socket.onclose = () => { if (viewer?.socket === socket) viewer = null; status.textContent = 'reconnecting…'; status.className = 'offline'; setTimeout(connectTv, 3000); };
    }

    // A jukebox restart can leave the SFU peer up with nothing flowing through
    // it, which looks exactly like a frozen picture until we re-handshake.
    let lastFrameTime = 0; let stalledPolls = 0;
    function watchForStall() {
      if (!video.srcObject) return;
      if (video.currentTime !== lastFrameTime) { lastFrameTime = video.currentTime; stalledPolls = 0; return; }
      if (++stalledPolls >= 4) { stalledPolls = 0; viewer?.close(); }
    }

    async function poll() {
      try {
        const response = await fetch('/tv/state', {cache: 'no-store'});
        const data = await response.json();
        now.textContent = data.now?.title || 'nothing on air';
        renderList(onDemandCard, onDemandQueue, data.queue.map((item) => item.title || item.url));
        renderList(fallbackCard, fallbackQueue, data.fallback_queue);
        queuesSection.hidden = onDemandCard.hidden && fallbackCard.hidden;
        watchForStall();
        await connectTv();
      } catch (error) {
        if (!video.srcObject) { status.textContent = 'stream unavailable'; status.className = 'offline'; }
      }
      setTimeout(poll, 5000);
    }
    sound.addEventListener('click', unmute);
    poll();
  </script>
</body>
</html>
