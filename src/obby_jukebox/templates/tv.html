<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>h4ks tv</title>
  <style>
    :root { --bg: #11131c; --panel: #191d2a; --border: #2e3550;
      --text: #f0f4ff; --dim: #7b8ab0; --mid: #b0bfe0;
      --blue: #5c9eff; --orange: #ff8c4b; }
    * { box-sizing: border-box; border-radius: 0 !important; }
    body { margin: 0; border-top: 2px solid var(--blue); background: var(--bg);
      color: var(--text); font: 15px/1.6 system-ui, sans-serif; }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 2rem 4rem; }
    header { align-items: flex-start; border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between;
      padding: 1.8rem 0 1.4rem; }
    .site-title { color: var(--blue); font: bold 1.5rem 'Courier New', monospace; }
    .tagline { color: var(--dim); font: .82rem 'Courier New', monospace; }
    nav { display: flex; flex-wrap: wrap; gap: .15rem; }
    nav a { border: 1px solid transparent; color: var(--mid); font: .82rem 'Courier New', monospace;
      padding: .2rem .65rem; }
    nav a:hover { background: var(--panel); border-color: var(--border); text-decoration: none; }
    .label { border-left: 2px solid var(--blue); color: var(--mid); font: .72rem 'Courier New', monospace;
      letter-spacing: .15em; margin: 2.2rem 0 1rem; padding-left: .7rem; text-transform: uppercase; }
    .stage { background: #080a10; border: 1px solid var(--border); }
    video { background: #080a10; display: block; min-height: 320px; width: 100%; }
    .stage-bar { align-items: center; background: var(--panel); border-top: 2px solid var(--orange);
      display: flex; gap: 1rem; justify-content: space-between; padding: .7rem 1rem; }
    .live { color: var(--orange); font: bold .78rem 'Courier New', monospace; letter-spacing: .12em; }
    .offline { color: var(--dim); }
    .info { display: grid; gap: 2rem; grid-template-columns: 2fr 1fr; }
    .panel { background: var(--panel); border: 1px solid var(--border); padding: 1rem; }
    h1, h2, p { margin-top: 0; } h2 { font-size: 1.1rem; }
    .muted { color: var(--dim); }
    @media (max-width: 700px) { .container { padding: 0 1rem 2rem; }
      .info { grid-template-columns: 1fr; } video { min-height: 220px; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div><a class="site-title" href="https://h4ks.com/">h4ks tv</a>
        <div class="tagline">a community of hackers, self-hosters &amp; builders</div></div>
      <nav><a href="https://chat.h4ks.com/">chat</a><a href="https://radio.h4ks.com/">radio</a>
        <a href="https://live.t3ks.com/livegames/">livegames</a><a href="https://h4ks.com/">h4ks ↗</a></nav>
    </header>
    <div class="label">on air</div>
    <section class="stage">
      <video id="video" controls autoplay playsinline></video>
      <div class="stage-bar"><span id="status" class="offline">connecting…</span>
        <span id="source" class="muted">waiting for a browser stream</span></div>
    </section>
    <div class="info">
      <section><div class="label">now showing</div><div class="panel"><h2 id="now">nothing on air</h2>
        <p id="fallback" class="muted">waiting for a fallback</p></div></section>
      <section><div class="label">the room</div><div class="panel"><p class="muted">
        Community television assembled from lives, games, videos, and music.</p>
        <a href="https://chat.h4ks.com/?channel=%24tv">join the $tv room ↗</a></div></section>
    </div>
  </div>
  <script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const source = document.getElementById('source');
    let reader;

    async function playWhep(url) {
      if (reader) reader.close();
      const pc = new RTCPeerConnection();
      reader = {close: () => pc.close()};
      pc.addTransceiver('video', {direction: 'recvonly'});
      pc.addTransceiver('audio', {direction: 'recvonly'});
      pc.ontrack = (event) => { video.srcObject = event.streams[0];
        status.textContent = '● LIVE'; status.className = 'live'; };
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await new Promise((resolve) => {
        if (pc.iceGatheringState === 'complete') resolve();
        else pc.addEventListener('icegatheringstatechange', () => {
          if (pc.iceGatheringState === 'complete') resolve();
        });
      });
      const response = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/sdp'},
        body: pc.localDescription.sdp});
      if (!response.ok) throw new Error(`WHEP ${response.status}`);
      await pc.setRemoteDescription({type: 'answer', sdp: await response.text()});
    }

    async function poll() {
      try {
        const response = await fetch('/tv/state', {cache: 'no-store'});
        const data = await response.json();
        now.textContent = data.now?.title || 'nothing on air';
        fallback.textContent = data.fallback || 'waiting for a fallback';
        source.textContent = data.stream_url ? 'direct WebRTC/WHEP source' : 'no browser source configured';
        if (data.stream_url && !reader) await playWhep(data.stream_url);
      } catch (error) {
        status.textContent = 'stream unavailable'; status.className = 'offline';
      }
      setTimeout(poll, 5000);
    }
    poll();
  </script>
</body>
</html>
