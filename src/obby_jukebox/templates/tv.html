<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>h4ks tv</title>
  <style>
    body {
      background: #101311;
      color: #e7eee4;
      font: 16px monospace;
      max-width: 900px;
      margin: 8vh auto;
      padding: 0 20px;
    }
    h1 { color: #b5f470; font-size: clamp(2rem, 7vw, 5rem); margin: 0; }
    main { border: 1px solid #394536; margin-top: 2rem; padding: 2rem; }
    small { color: #99a592; }
    a { color: #b5f470; }
    .viewer {
      background: #070907;
      border: 1px solid #394536;
      height: min(75vh, 720px);
      margin-top: 2rem;
      position: relative;
    }
    .viewer iframe { border: 0; height: 100%; width: 100%; }
  </style>
</head>
<body>
  <h1>h4ks tv</h1>
  <small>same programme, scattered sofas</small>
  <main>
    <p id="status">tuning in…</p>
    <h2 id="now">—</h2>
    <p id="fallback"></p>
    <p>
      <a href="https://chat.h4ks.com/?channel=%24tv">open the stream directly ↗</a>
    </p>
    <div class="viewer">
      <iframe
        src="https://chat.h4ks.com/?channel=%24tv"
        title="h4ks TV stream"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen
      ></iframe>
    </div>
  </main>
  <script>
    async function poll() {
      try {
        const response = await fetch('/tv/state', {cache: 'no-store'});
        const data = await response.json();
        status.textContent = data.now ? 'ON AIR' : 'OFF AIR';
        now.textContent = data.now?.title || 'nothing on air';
        fallback.textContent = data.fallback || 'waiting for a fallback';
      } catch (error) {
        status.textContent = 'station unavailable';
      }
      setTimeout(poll, 3000);
    }
    poll();
  </script>
</body>
</html>
